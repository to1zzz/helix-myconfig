# ~/.config/helix/languages.toml

# Bash
[[language]]
name = "bash"
auto-format = true
indent = { tab-width = 4, unit = " " }
formatter = { command = "shfmt", args = ["-i", "4"] }
file-types = [
  "conf",
  "sh",
  "bash",
  "zsh",
  ".bash_login",
  ".bash_logout",
  ".bash_profile",
  ".bashrc",
  ".profile",
  ".zshenv",
  ".zlogin",
  ".zlogout",
  ".zprofile",
  ".zshrc",
  "APKBUILD",
  "PKGBUILD",
  "eclass",
  "ebuild",
  "bazelrc",
]

# Rust
[[language]]
name = "rust"
auto-format = true
formatter = { command = "rustfmt" }
language-servers = ["rust-analyzer"]

 # Go
[[language]]
name = "go"
auto-format = true
formatter = { command = "gofmt" }
language-servers = ["gopls"]

# Python 
[[language]]
name = "python"
auto-format = true
language-servers = ["ruff", "pylsp"] 
formatter = { command = "ruff", args = ["format", "-"] }

[language-server.ruff]
command = "ruff"
args = ["server"]
