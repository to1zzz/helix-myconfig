theme = "gruvbox"

[editor]
default-yank-register = "+"
color-modes = true

[editor.statusline]
left = ["mode", "spinner", "file-name", "read-only-indicator", "file-modification-indicator"]
center = [] 
right = ["diagnostics", "spacer", "version-control", "spacer", "selections", "spacer", "position-percentage", "spacer", "position", "file-type"]

diagnostics = ["error", "warning", "info", "hint"]
