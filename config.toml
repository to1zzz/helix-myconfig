# ~/.config/helix/config.toml
# theme = "gruvbox"
theme = "gruvbox-material"

# Editor
[editor]
mouse = false
line-number = "relative"
default-yank-register = "+"   
lsp.display-messages = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

# Statusline
[editor.statusline]
left = [
    "mode",
    "spinner",
    "file-name",
    "read-only-indicator",
    "file-modification-indicator",
]

right = [
    "diagnostics",
    "selections",
    "position",
    "file-encoding",
    "file-line-ending",    
    "file-type",
]

diagnostics = ["warning", "error"]
workspace-diagnostics = ["warning", "error"]
separator = " │ "

# mode.normal = "NORMAL"
# mode.insert = "INSERT"
# mode.select = "SELECT"

# Keymap
[keys.normal]
# Paragraph navigation
"}" = "goto_next_paragraph"
"{" = "goto_prev_paragraph"

# Cursors
"esc" = ["collapse_selection", "keep_primary_selection"]

# Config / buffers
"A-r" = [":config-reload", ":reload"]
"A-c" = ":config-open"
"A-w" = ":buffer-close"
"A-h" = "goto_previous_buffer"
"A-l" = "goto_next_buffer"

# Move line up/down
"ret"   = ["move_line_down", "goto_first_nonwhitespace"]
"A-ret" = ["move_line_up",   "goto_first_nonwhitespace"]

# Extend selection one line up
"X" = "extend_line_up"

# Duplicate-style line move
"C-j" = ["extend_to_line_bounds", "delete_selection", "move_line_down", "paste_before"]
"C-k" = ["extend_to_line_bounds", "delete_selection", "move_line_up",   "paste_before"]

# Git submenu
[keys.normal."A-g"]
b = ":sh git blame -L %{cursor_line},+1 %{buffer_name}"
s = ":sh git status --porcelain"
l = ":sh git log --oneline -10 %{buffer_name}"
B = ":sh git branch --show-current"
S = ":sh git status"
